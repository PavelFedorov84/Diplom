---
- name: Удалить старый пакет репозитория Zabbix
  apt:
    name: zabbix-release
    state: absent
    purge: yes

- name: Удалить файлы репозитория Zabbix
  file:
    path: /etc/apt/sources.list.d/zabbix.list
    state: absent



- name: Скачать пакет репозитория Zabbix
  get_url:
    url: "https://repo.zabbix.com/zabbix/6.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.0-4+ubuntu22.04_all.deb"
    dest: /tmp/zabbix-release.deb

- name: Установить пакет репозитория Zabbix
  apt:
    deb: /tmp/zabbix-release.deb
    state: present

- name: Обновить кэш apt
  apt:
    update_cache: yes



- name: Install packages
  apt:
    name:
      - mysql-server
      - zabbix-server-mysql
      - zabbix-frontend-php
      - zabbix-apache-conf
      - zabbix-sql-scripts
      - zabbix-agent
      - apache2
    state: present

- name: Start MySQL
  service:
    name: mysql
    state: started
    enabled: yes

- name: Create database
  shell: |
    mysql <<EOF
    CREATE DATABASE IF NOT EXISTS {{ db_name }} CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
    CREATE USER IF NOT EXISTS '{{ db_user }}'@'localhost' IDENTIFIED BY '{{ db_pass }}';
    GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'localhost';
    FLUSH PRIVILEGES;
    EOF

- name: Import schema
  shell: |
    zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mysql {{ db_name }}
    touch /tmp/.zabbix_schema_done
  args:
    creates: /tmp/.zabbix_schema_done

- name: Configure Zabbix Server
  copy:
    content: |
      LogFile=/var/log/zabbix/zabbix_server.log
      DBHost=localhost
      DBName={{ db_name }}
      DBUser={{ db_user }}
      DBPassword={{ db_pass }}
      ListenPort=10051
    dest: /etc/zabbix/zabbix_server.conf
    mode: '0640'
    group: zabbix

- name: Setup web frontend
  copy:
    content: |
      <?php
      global $DB;
      $DB['TYPE'] = 'MYSQL';
      $DB['SERVER'] = 'localhost';
      $DB['PORT'] = '0';
      $DB['DATABASE'] = '{{ db_name }}';
      $DB['USER'] = '{{ db_user }}';
      $DB['PASSWORD'] = '{{ db_pass }}';
      $ZBX_SERVER = 'localhost';
      $ZBX_SERVER_PORT = '10051';
      $ZBX_SERVER_NAME = 'Zabbix Server';
    dest: /etc/zabbix/web/zabbix.conf.php
    owner: www-data
    group: www-data
    mode: '0640'

- name: Set timezone
  lineinfile:
    path: /etc/zabbix/apache.conf
    regexp: '^\s*#?\s*php_value date\.timezone'
    line: '        php_value date.timezone Europe/Moscow'

- name: Create log dir
  file:
    path: /var/log/zabbix
    state: directory
    owner: zabbix
    group: zabbix
    mode: '0755'

- name: Ensure Zabbix Server is running
  ansible.builtin.systemd:
    name: zabbix-server
    state: restarted
    enabled: yes
    daemon_reload: yes
  async: 300
  poll: 0

- name: Start other services
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - zabbix-agent
    - apache2

- name: Success message
  debug:
    msg:
      - "Zabbix установлен!"
      - "URL: http://{{ ansible_default_ipv4.address }}/zabbix"
      - "Логин: Admin"
      - "Пароль: zabbix"