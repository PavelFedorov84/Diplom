---
- name: Create CPU trigger for {{ current_host }}
  ansible.builtin.uri:
    url: "{{ zabbix_url }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "trigger.create"
      params:
        - description: "CPU utilization is high on {{ current_host }}"
          expression: "min(/{{ current_host }}/system.cpu.util[,idle],5m) < {{ 100 - thresholds.cpu_warning }}"
          priority: 3
          tags:
            - tag: "USE"
              value: "Utilization"
            - tag: "component"
              value: "CPU"
      auth: "{{ auth_token }}"
      id: "{{ 400 + current_idx }}"
    headers:
      Content-Type: "application/json"
  ignore_errors: yes

- name: Create memory trigger for {{ current_host }}
  ansible.builtin.uri:
    url: "{{ zabbix_url }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "trigger.create"
      params:
        - description: "Memory usage is high on {{ current_host }}"
          expression: "(last(/{{ current_host }}/vm.memory.size[used]) / last(/{{ current_host }}/vm.memory.size[total])) * 100 > {{ thresholds.memory_warning }}"
          priority: 3
          tags:
            - tag: "USE"
              value: "Utilization"
            - tag: "component"
              value: "Memory"
      auth: "{{ auth_token }}"
      id: "{{ 401 + current_idx }}"
    headers:
      Content-Type: "application/json"
  ignore_errors: yes

- name: Create disk trigger for {{ current_host }}
  ansible.builtin.uri:
    url: "{{ zabbix_url }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "trigger.create"
      params:
        - description: "Disk space is low on {{ current_host }}"
          expression: "(last(/{{ current_host }}/vfs.fs.size[/,used]) / last(/{{ current_host }}/vfs.fs.size[/,total])) * 100 > {{ thresholds.disk_warning }}"
          priority: 3
          tags:
            - tag: "USE"
              value: "Utilization"
            - tag: "component"
              value: "Disk"
      auth: "{{ auth_token }}"
      id: "{{ 402 + current_idx }}"
    headers:
      Content-Type: "application/json"
  ignore_errors: yes