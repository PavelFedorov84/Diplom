- name: Configure Kibana
  hosts: kibana_servers
  vars:
    elasticsearch_admin_password: "{{ lookup('env', 'ES_PASSWORD') | default('elastic123') }}"
    kibana_user_password: "{{ lookup('env', 'KIBANA_PASSWORD') | default(elasticsearch_admin_password) }}"
  become: yes
  
  pre_tasks:
    - name: Get Elasticsearch host
      set_fact:
        es_host: "{{ groups['elasticsearch_servers'][0] }}"
      run_once: true
      
    # Пропускаем эту задачу, так как security выключен
    # - name: Setup kibana_system password in Elasticsearch
    #   uri:
    #     url: "http://{{ es_host }}:9200/_security/user/kibana_system/_password"
    #     method: POST
    #     ...
      
  roles:
    - role: kibana
      vars:
        kibana_elasticsearch_host: "http://{{ es_host }}:9200"
        # Не передаем username/password, так как security выключен
        # kibana_elasticsearch_username: "kibana_system"
        # kibana_elasticsearch_password: "{{ kibana_user_password }}"